version: "3.9"

services:
  api:
    build: .
    container_name: it-appointments-api
    depends_on:
      - db
      - redis
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
    # İleride buraya logging, restart policy vs. ekleriz

  db:
    image: postgres:16-alpine
    container_name: it-appointments-db
    restart: always
    environment:
      POSTGRES_USER: ituser
      POSTGRES_PASSWORD: itpassword
      POSTGRES_DB: itappointments
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ituser -d itappointments"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:                      # 🔴 YENİ: Redis servisi
    image: redis:7-alpine
    container_name: it-appointments-redis
    restart: always
    ports:
      - "6379:6379"

  worker:                     # 🔴 YENİ: Queue worker servisi
    build: .
    container_name: it-appointments-worker
    depends_on:
      - redis
    env_file:
      - .env
    command: >
      python -m app.worker
    # Bu worker, Redis kuyruğundaki job'ları dinleyecek

volumes:
  postgres_data:
